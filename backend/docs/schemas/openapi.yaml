openapi: 3.0.0
info:
  version: 1.1.0
  title: HomiesHomes Real Estate API
  description: A RESTful API for HomiesHomes real estate listings platform. This API provides endpoints for managing users, properties, bookings, favorites, and agent requests.
  contact:
    name: Mandeep Pandya
  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: "https://gammacairo-deltareward-9000.codio-box.uk"
    description: Codio API server
  - url: "https://gammacairo-deltareward-3000.codio-box.uk"
    description: Codio frontend server
tags:
  - name: Users
    description: API endpoints for user management and authentication.
  - name: Properties
    description: API endpoints for real estate property listings.
  - name: Bookings
    description: API endpoints for property viewing bookings.
  - name: Favourites
    description: API endpoints for managing user's favorite properties.
  - name: Agent Requests
    description: API endpoints for managing agent role requests.

# Security schemes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Authentication. A valid JWT token must be passed in the Authorization header.
        Example: `Authorization: Bearer {token}`

        You can obtain a token by using the /login endpoint with valid credentials.
        Tokens are valid for 1 hour after issuance.
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed"

paths:
  /register:
    post:
      tags:
        - Users
      summary: Register a new user
      description: Creates a new user account with the provided information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - user_email
                - user_firstName
                - user_lastName
              properties:
                username:
                  type: string
                  example: john_doe
                password:
                  type: string
                  format: password
                  example: securePassword123
                user_email:
                  type: string
                  format: email
                  example: john.doe@example.com
                user_phone:
                  type: string
                  example: "1234567890"
                user_firstName:
                  type: string
                  example: John
                user_lastName:
                  type: string
                  example: Doe
                user_levels:
                  type: integer
                  example: 0
                  description: User level (0=regular user, 1=agent, 2=admin)
      responses:
        "201":
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: john_doe
                      user_email:
                        type: string
                        example: john.doe@example.com
                      user_firstName:
                        type: string
                        example: John
                      user_lastName:
                        type: string
                        example: Doe
                      user_levels:
                        type: integer
                        example: 0
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Username already exists"

  /login:
    post:
      tags:
        - Users
      summary: User login
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: john_doe
                      user_email:
                        type: string
                        example: john.doe@example.com
                      user_firstName:
                        type: string
                        example: John
                      user_lastName:
                        type: string
                        example: Doe
                      user_levels:
                        type: integer
                        example: 0
                  message:
                    type: string
                    example: "Login successful"
        "401":
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid username or password"
                  error:
                    type: string
                    example: "Authentication failed"

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Returns a list of all users (admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                      example: 1
                    username:
                      type: string
                      example: john_doe
                    user_email:
                      type: string
                      example: john.doe@example.com
                    user_firstName:
                      type: string
                      example: John
                    user_lastName:
                      type: string
                      example: Doe
                    user_phone:
                      type: string
                      example: "1234567890"
                    user_levels:
                      type: integer
                      example: 0
        "401":
          description: Unauthorized - Only admin users can list all accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: User ID

    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns a user by their ID.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    example: 1
                  username:
                    type: string
                    example: john_doe
                  user_email:
                    type: string
                    example: john.doe@example.com
                  user_firstName:
                    type: string
                    example: John
                  user_lastName:
                    type: string
                    example: Doe
                  user_phone:
                    type: string
                    example: "1234567890"
                  user_levels:
                    type: integer
                    example: 0
        "401":
          description: Unauthorized - Non-admin users can only view their own record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes a user account (admin only or self-deletion).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User deleted successfully"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /properties:
    get:
      tags:
        - Properties
      summary: Get all properties
      description: Returns a list of all properties with optional filtering.
      parameters:
        - in: query
          name: location
          schema:
            type: string
          description: Location filter
        - in: query
          name: minBedrooms
          schema:
            type: integer
          description: Minimum number of bedrooms
        - in: query
          name: maxBedrooms
          schema:
            type: integer
          description: Maximum number of bedrooms
        - in: query
          name: minBathrooms
          schema:
            type: integer
          description: Minimum number of bathrooms
        - in: query
          name: maxBathrooms
          schema:
            type: integer
          description: Maximum number of bathrooms
        - in: query
          name: minPrice
          schema:
            type: number
          description: Minimum price filter
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Maximum price filter
        - in: query
          name: property_type
          schema:
            type: string
          description: Type of property (Apartment, House, etc.)
        - in: query
          name: sortBy
          schema:
            type: string
          description: Field to sort by (price, bedrooms, bathrooms, etc.)
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
          description: Sort order (ASC or DESC)
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum number of results to return
        - in: query
          name: agent_id
          schema:
            type: integer
          description: Filter by agent ID
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: "Modern Apartment Downtown"
                    price:
                      type: number
                      example: 250000
                    location:
                      type: string
                      example: "Birmingham, UK"
                    bedrooms:
                      type: integer
                      example: 2
                    bathrooms:
                      type: integer
                      example: 1
                    property_type:
                      type: string
                      example: "Apartment"
                    image_url:
                      type: string
                      example: "prop1.jpg"
                    agent_id:
                      type: integer
                      example: 2
                    agent_username:
                      type: string
                      example: "realtor_jack"
                    agent_email:
                      type: string
                      example: "jack@example.com"
                    agent_phone:
                      type: string
                      example: "07700900000"
                    agent_firstName:
                      type: string
                      example: "Jack"
                    agent_lastName:
                      type: string
                      example: "Smith"
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              example: "/properties/1"
                            method:
                              type: string
                              example: "GET"

    post:
      tags:
        - Properties
      summary: Create property
      description: Creates a new property listing (agent or admin role required).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - price
                - location
                - bedrooms
                - bathrooms
                - property_type
              properties:
                title:
                  type: string
                  example: "Modern Apartment Downtown"
                description:
                  type: string
                  example: "Beautiful modern apartment in the heart of the city."
                price:
                  type: number
                  example: 250000
                location:
                  type: string
                  example: "Birmingham, UK"
                bedrooms:
                  type: integer
                  example: 2
                bathrooms:
                  type: integer
                  example: 1
                property_type:
                  type: string
                  example: "Apartment"
                image_url:
                  type: string
                  example: "prop1.jpg"
      responses:
        "201":
          description: Property successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Property created successfully"
                  property_id:
                    type: integer
                    example: 1
        "401":
          description: Unauthorized - Must be agent or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /properties/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: Property ID

    get:
      tags:
        - Properties
      summary: Get property by ID
      description: Returns a property by its ID.
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: "Modern Apartment Downtown"
                      description:
                        type: string
                        example: "Beautiful modern apartment in the heart of the city."
                      price:
                        type: number
                        example: 250000
                      location:
                        type: string
                        example: "Birmingham, UK"
                      bedrooms:
                        type: integer
                        example: 2
                      bathrooms:
                        type: integer
                        example: 1
                      property_type:
                        type: string
                        example: "Apartment"
                      image_url:
                        type: string
                        example: "prop1.jpg"
                      agent_id:
                        type: integer
                        example: 2
                      agent:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: "60d0fe4f5311236168a109ca"
                          name:
                            type: string
                            example: "John Smith"
                          phone:
                            type: string
                            example: "07700900000"
                          avatar:
                            type: string
                            example: "avatar.jpg"
                  success:
                    type: boolean
                    example: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Properties
      summary: Update property
      description: Updates a property listing (agent owner or admin role required).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Apartment Title"
                description:
                  type: string
                  example: "Updated property description."
                price:
                  type: number
                  example: 275000
                location:
                  type: string
                  example: "Updated location"
                bedrooms:
                  type: integer
                  example: 3
                bathrooms:
                  type: integer
                  example: 2
                property_type:
                  type: string
                  example: "Condo"
                image_url:
                  type: string
                  example: "prop2.jpg"
      responses:
        "200":
          description: Property successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Property updated successfully"
                  property_id:
                    type: integer
                    example: 1
        "401":
          description: Unauthorized - Must be property owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Properties
      summary: Delete property
      description: Deletes a property listing (agent owner or admin role required).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Property successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Property deleted successfully"
        "401":
          description: Unauthorized - Must be property owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings:
    get:
      tags:
        - Bookings
      summary: Get user bookings
      description: Returns a list of all bookings for the authenticated user. Admins see all bookings, agents see bookings for their properties, and regular users see their own bookings.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, attended]
          description: Filter by booking status
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Filter by bookings after this date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Filter by bookings before this date
        - in: query
          name: sort
          schema:
            type: string
            enum: [date_asc, date_desc]
          description: Sort by date ascending or descending
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        booking_id:
                          type: integer
                          example: 1
                        property_id:
                          type: integer
                          example: 1
                        user_id:
                          type: integer
                          example: 3
                        agent_id:
                          type: integer
                          example: 2
                        booking_status:
                          type: string
                          enum: [pending, confirmed, cancelled, attended]
                          example: "pending"
                        scheduled_date:
                          type: string
                          format: date
                          example: "2023-04-15"
                        scheduled_time:
                          type: string
                          example: "14:00"
                        notes:
                          type: string
                          example: "Interested in the kitchen space"
                        booking_created:
                          type: string
                          format: date-time
                          example: "2023-04-01T10:30:00Z"
                        property_title:
                          type: string
                          example: "Modern Apartment Downtown"
                        property_location:
                          type: string
                          example: "Birmingham, UK"
                        property_image:
                          type: string
                          example: "prop1.jpg"
                        user_username:
                          type: string
                          example: "john_doe"
                        user_firstName:
                          type: string
                          example: "John"
                        user_lastName:
                          type: string
                          example: "Doe"
                        user_email:
                          type: string
                          example: "john.doe@example.com"
                        user_phone:
                          type: string
                          example: "1234567890"
                        agent_username:
                          type: string
                          example: "agent_smith"
                        agent_firstName:
                          type: string
                          example: "Agent"
                        agent_lastName:
                          type: string
                          example: "Smith"
                        agent_email:
                          type: string
                          example: "agent.smith@example.com"
                        agent_phone:
                          type: string
                          example: "0987654321"
                        _links:
                          type: object
                          properties:
                            self:
                              type: object
                              properties:
                                href:
                                  type: string
                                  example: "/bookings/1"
                                method:
                                  type: string
                                  example: "GET"
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "/bookings"
                          method:
                            type: string
                            example: "GET"
                      create:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "/bookings"
                          method:
                            type: string
                            example: "POST"
                          description:
                            type: string
                            example: "Create a new booking"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Bookings
      summary: Create booking
      description: Creates a new property viewing booking.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - property_id
                - scheduled_date
                - scheduled_time
              properties:
                property_id:
                  type: integer
                  example: 1
                scheduled_date:
                  type: string
                  format: date
                  example: "2023-04-15"
                scheduled_time:
                  type: string
                  example: "14:00"
                notes:
                  type: string
                  example: "Interested in the kitchen space"
      responses:
        "201":
          description: Booking successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Booking created successfully"
                  booking_id:
                    type: integer
                    example: 1
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: Booking ID

    get:
      tags:
        - Bookings
      summary: Get booking by ID
      description: Returns a booking by its ID. Users can only view their own bookings, agents can view bookings for their properties, and admins can view all bookings.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: integer
                    example: 1
                  property_id:
                    type: integer
                    example: 1
                  user_id:
                    type: integer
                    example: 3
                  agent_id:
                    type: integer
                    example: 2
                  booking_status:
                    type: string
                    enum: [pending, confirmed, cancelled, attended]
                    example: "pending"
                  scheduled_date:
                    type: string
                    format: date
                    example: "2023-04-15"
                  scheduled_time:
                    type: string
                    example: "14:00"
                  notes:
                    type: string
                    example: "Interested in the kitchen space"
                  booking_created:
                    type: string
                    format: date-time
                    example: "2023-04-01T10:30:00Z"
                  property:
                    type: object
                    properties:
                      title:
                        type: string
                        example: "Modern Apartment Downtown"
                      location:
                        type: string
                        example: "Birmingham, UK"
                      image_url:
                        type: string
                        example: "prop1.jpg"
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                        example: "john_doe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      name:
                        type: string
                        example: "John Doe"
                      phone:
                        type: string
                        example: "1234567890"
                  agent:
                    type: object
                    properties:
                      username:
                        type: string
                        example: "agent_smith"
                      email:
                        type: string
                        example: "agent.smith@example.com"
                      name:
                        type: string
                        example: "Agent Smith"
                      phone:
                        type: string
                        example: "0987654321"
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "/bookings/1"
                          method:
                            type: string
                            example: "GET"
        "401":
          description: Unauthorized - Must be booking owner, property agent, or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{id}/status:
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: Booking ID

    put:
      tags:
        - Bookings
      summary: Update booking status
      description: Updates a booking's status. Users can cancel their own bookings, agents can update statuses for their properties, and admins can update all booking statuses.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, cancelled, attended]
                  example: "confirmed"
      responses:
        "200":
          description: Booking status successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Booking status updated to confirmed"
                  booking_id:
                    type: integer
                    example: 1
                  status:
                    type: string
                    example: "confirmed"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /favourites:
    get:
      tags:
        - Favourites
      summary: Get user favourites
      description: Returns a list of all favourited properties for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of favourited properties
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    property_id:
                      type: integer
                      example: 1
                    user_id:
                      type: integer
                      example: 3
                    favourite_date:
                      type: string
                      format: date-time
                      example: "2023-04-01T10:30:00Z"
                    title:
                      type: string
                      example: "Modern Apartment Downtown"
                    price:
                      type: number
                      example: 250000
                    location:
                      type: string
                      example: "Birmingham, UK"
                    description:
                      type: string
                      example: "Beautiful modern apartment in the heart of the city."
                    property_type:
                      type: string
                      example: "Apartment"
                    bedrooms:
                      type: integer
                      example: 2
                    bathrooms:
                      type: integer
                      example: 1
                    image_url:
                      type: string
                      example: "prop1.jpg"
                    agent_id:
                      type: integer
                      example: 2
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Favourites
      summary: Add favourite
      description: Adds a property to the user's favourites.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - property_id
              properties:
                property_id:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Property successfully added to favourites
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Property added to favourites"
                  favorite:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 3
                      property_id:
                        type: integer
                        example: 1
        "400":
          description: Bad request - property already in favourites
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Property already in favourites"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found - property does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Property not found"

  /favourites/{property_id}:
    parameters:
      - in: path
        name: property_id
        schema:
          type: integer
        required: true
        description: Property ID to remove from favourites

    delete:
      tags:
        - Favourites
      summary: Remove favourite
      description: Removes a property from the user's favourites.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Property successfully removed from favourites
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Property removed from favourites"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Favourite not found"

  /agent-requests:
    get:
      tags:
        - Agent Requests
      summary: Get all agent requests
      description: Returns a list of all agent role requests (admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of agent requests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    request_id:
                      type: integer
                      example: 1
                    user_id:
                      type: integer
                      example: 2
                    request_date:
                      type: string
                      format: date-time
                      example: "2023-03-30T12:00:00Z"
                    response_date:
                      type: string
                      format: date-time
                      example: null
                    status:
                      type: string
                      enum: [pending, approved, rejected]
                      example: "pending"
                    request_reason:
                      type: string
                      example: "I'm a professional real estate agent with 5 years of experience."
                    username:
                      type: string
                      example: "john_doe"
                    user_email:
                      type: string
                      example: "john.doe@example.com"
                    user_firstName:
                      type: string
                      example: "John"
                    user_lastName:
                      type: string
                      example: "Doe"
        "401":
          description: Unauthorized - Only admin users can list all agent requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Agent Requests
      summary: Create an agent request
      description: Creates a new agent role request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_reason
              properties:
                request_reason:
                  type: string
                  example: "I'm a professional real estate agent with 5 years of experience."
      responses:
        "201":
          description: Agent request successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Agent request submitted successfully"
                  request:
                    type: object
                    properties:
                      request_id:
                        type: integer
                        example: 1
                      user_id:
                        type: integer
                        example: 2
                      status:
                        type: string
                        enum: [pending, approved, rejected]
                        example: "pending"
                      request_reason:
                        type: string
                        example: "I'm a professional real estate agent with 5 years of experience."
                      request_date:
                        type: string
                        format: date-time
                        example: "2023-03-30T12:00:00Z"
        "400":
          description: Bad request - validation error or user already has a pending request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "You already have a pending agent request"

  /agent-requests/status:
    get:
      tags:
        - Agent Requests
      summary: Get user's agent request status
      description: Returns the status of the current user's agent request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User's agent request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                    example: 1
                  user_id:
                    type: integer
                    example: 2
                  status:
                    type: string
                    enum: [pending, approved, rejected]
                    example: "pending"
                  request_date:
                    type: string
                    format: date-time
                    example: "2023-03-30T12:00:00Z"
                  response_date:
                    type: string
                    format: date-time
                    example: null
                  request_reason:
                    type: string
                    example: "I'm a professional real estate agent with 5 years of experience."
        "404":
          description: No agent request found for the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No agent request found"

  /agent-requests/{id}/respond:
    parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
        description: Agent request ID

    put:
      tags:
        - Agent Requests
      summary: Respond to agent request
      description: Updates the status of an agent request and optionally promotes the user to agent (admin only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: "approved"
                response_text:
                  type: string
                  example: "Approved based on your experience."
      responses:
        "200":
          description: Agent request status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Agent request updated successfully"
                  status:
                    type: string
                    enum: [pending, approved, rejected]
                    example: "approved"
        "400":
          description: Bad request - invalid status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid status provided"
        "401":
          description: Unauthorized - Only admin users can update agent request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent request not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Agent request not found"
